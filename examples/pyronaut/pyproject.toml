#:schema ./__pyronaut__/schemas/pyronaut-pyproject.schema.json
# Generated by pyronaut-install for Pyronaut TOML schema support.

[project]
name = "example"
version = "1.0.0"
dynamic = [
    "scripts",
]

[build-system]
requires = [
    "setuptools",
    "wheel",
    "tomli",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.pyronaut]
repositories = [
    "mavenCentral",
]

[tool.pyronaut.core]
version = "5.2.15"

[tool.pyronaut.platform]
version = "5.2.2"

[tool.pyronaut.toolchain]
type = "jvm"

[tool.pyronaut.sources]
python = "src"
python-test = "tests"
resources = "config"
test-resources = "tests-config"

[tool.pyronaut.ide-stubs]
packages = [
    "io.micronaut",
    "jakarta",
]

[tool.pyronaut.validation]
enabled = true

[tool.pyronaut.test]
# The tests are JUnit 5 modules: wiremock-micronaut is a JUnit extension.
engine = "junit"

[tool.pyronaut.test-resources]
enabled = false
infer-classpath = false

[tool.pyronaut.dependencies]
runtime = [
    "io.micronaut:micronaut-http-server-netty",
    "io.micronaut:micronaut-http-client",
    "io.micronaut.reactor:micronaut-reactor",
    "io.micronaut.serde:micronaut-serde-jackson",
    "io.micronaut.pyronaut:micronaut-pyronaut-logback",
]
build = [
    "io.micronaut.serde:micronaut-serde-processor",
]
test = [
    "io.micronaut.test:micronaut-test-junit5",
    "io.micronaut.pyronaut:micronaut-pyronaut-requests",
    # Built from this repo: run ./gradlew publishToMavenLocal first.
    "io.github.leeturner:wiremock-micronaut:0.1.0-SNAPSHOT",
]
