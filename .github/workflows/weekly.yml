name: Latest Micronaut 5.x
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build -PmicronautVersion=5.+ --refresh-dependencies
      - name: Report resolved Micronaut version
        if: always()
        run: |
          ./gradlew -q dependencyInsight -PmicronautVersion=5.+ \
            --dependency io.micronaut.platform:micronaut-platform --configuration compileClasspath \
            | tee insight.txt
          echo "Micronaut platform: \`$(grep -m1 -o '5\.+ -> [^ ]*' insight.txt)\`" >> "$GITHUB_STEP_SUMMARY"
